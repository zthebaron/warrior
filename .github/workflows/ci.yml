name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40 # was 20 (H3, never measured); see OQ-056 item 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # visual goldens are *.png, which .gitattributes routes through LFS

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3 # harness stages are .ts run by Node's built-in type stripping (>= 22.18)
          cache: npm

      - run: npm ci

      - name: Install Chromium (+ headless shell, + system deps)
        run: npx playwright install --with-deps chromium

      - run: npm run typecheck

      - run: npm run lint:levels
      - run: npm run lint:self # D-015: READABLE_RISE and CHAPTER_TEACH must be seen to FAIL, not just pass

      # B-12: the patroller runtime (src/systems/patrol.ts) is a pure function of phase + t*speed
      - run: npm run check:patrol
      - run: npm run check:progression

      # NOT list (SPEC.md §7): refused fields absent from the schema, refused identifiers absent from src/
      - run: npm run lint:not-list
      # The prompt pack must not instruct a NOT-listed concept unmarked (UNMARKED_RETIRED); self-test proves it bites
      - run: npm run lint:pack

      - run: npm run lint:accent # D-001 ACCENT_CONTRAST, named on its own so a failure says which rule

      # Tier-1 asset budgets on the COMMITTED assets/dist (CI has no Blender and never rebuilds):
      # manifest against assets/manifest.schema.json, manifest against a re-measure of every
      # shipped .glb, every measurement against tools/assets/budgets.json.
      - run: npm run assets:budget

      # schema -> lint-level -> preflight -> nav -> phase-sweep -> replay -> chaos -> hazards -> counters -> assets -> accent -> visual
      # exit 1 LEVEL_FAILURE · 2 BUILD_FAILURE · 3 HARNESS_ENVIRONMENT_FAILURE · 4 HARNESS_SETUP_FAILURE
      - run: npm run playtest

      - name: Upload harness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-report
          path: |
            harness-report.json
            tools/harness/golden/**/*.actual.png
          if-no-files-found: warn
