<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Karasu: Flight of the Exile</title>
    <meta name="description" content="Karasu: Flight of the Exile" />
    <script>
      // D-022, the gate. The title screen, the how-to-play page and sound exist only at the game's front door.
      // With any of these parameters the page is a test or a tool: <html class="bare">, and nothing below the
      // canvas and the HUD is ever put in the document. src/ reads this class and decides nothing itself.
      (function () {
        var q = new URLSearchParams(location.search);
        var bare = ['harness', 'playtest', 'replay', 'instrument', 'level'].some(function (k) { return q.has(k); });
        document.documentElement.className = bare ? 'bare' : 'shell';
      })();
    </script>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
      #app { position: fixed; inset: 0; }
      #hud { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
             pointer-events: none; font: 600 20px/1.5 system-ui, sans-serif; color: #fff;
             text-shadow: 0 1px 3px #000; text-align: center; white-space: pre-line; }

      /* ---- D-022: the title screen and the how-to-play page. Every number is in MEASUREMENTS.md "D-022 title screen". ---- */
      :root {
        --paper: #e0d4be;  /* the title painting's own paper tone (tools/art/ui-art.mjs measures it) */
        --ink: #20201e;    /* palette.json ink-black */
        --ink-soft: #534e4b; /* palette.json ink-grey */
        --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      }
      .shell body { background: var(--paper); }
      .shell [hidden] { display: none !important; }
      .shell #hud { font: 600 clamp(16px, 2.2vw, 30px)/1.5 var(--serif); letter-spacing: 0.04em; color: var(--ink);
                    text-shadow: 0 0 0.5em var(--paper), 0 0 0.25em var(--paper), 0 0 0.1em var(--paper); }
      #hint { position: fixed; left: 14px; bottom: 10px; z-index: 5; pointer-events: none; font: 500 13px/1.3 var(--serif);
              letter-spacing: 0.04em; color: var(--ink); opacity: 0.72;
              text-shadow: 0 0 0.5em var(--paper), 0 0 0.25em var(--paper); }
      #hint[hidden] { display: none; }
      /* D-025: a move's one line, low on the screen while playing. Ink on a wash of paper with no edge; the keys
         are the how-to-play page's. Every number is in MEASUREMENTS.md "D-025 the teach prompts". */
      #teach { position: fixed; left: 50%; bottom: clamp(40px, 9vh, 120px); transform: translateX(-50%); z-index: 5; pointer-events: none;
               box-sizing: border-box; width: max-content; max-width: min(92vw, 44em); padding: 0.5em 1.1em; text-align: center;
               font: 500 clamp(15px, 1vw + 9px, 26px)/1.5 var(--serif); letter-spacing: 0.02em; color: var(--ink);
               background: rgba(224, 212, 190, 0.86); border-radius: 0.4em; box-shadow: 0 0 0.9em 0.5em rgba(224, 212, 190, 0.86); }
      #teach[hidden] { display: none; }

      .btn { font: inherit; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink); cursor: pointer;
             padding: 0.6em 1.3em; min-height: 44px; border: 0.12em solid var(--ink); border-radius: 0.2em;
             background: rgba(224, 212, 190, 0.9); -webkit-tap-highlight-color: transparent; }
      .btn.primary { background: var(--ink); color: var(--paper); }
      .btn.quiet { border-color: transparent; background: none; text-transform: none; letter-spacing: 0.03em; padding: 0.6em 0.5em; }
      .btn:hover { filter: brightness(1.12); }
      .btn:focus-visible { outline: 0.18em solid var(--ink); outline-offset: 0.2em; }
      .btn[disabled] { opacity: 0.75; cursor: progress; }

      /* The title. Three shapes of screen, one painting (1376x768), whose keep zone is x 17% to 81%:
         wider than the painting   the whole painting, full height, centred; title-wide.webp beside it
         between the two           the painting fills the screen; its sides are cropped, never past the keep zone
         narrower than the zone    the keep zone across the top; title-tall.webp below it; the buttons under it.
                                   The painting takes the height the buttons leave: in a near-square window it is
                                   shorter than the keep zone at full width, so it shows more than the zone, and
                                   never less than its own full height (B-59) */
      #title { position: fixed; inset: 0; z-index: 30; overflow: hidden; display: grid; place-items: center;
               font-family: var(--serif); color: var(--ink);
               background: var(--paper) url(./assets/ui/title-wide.webp) center / auto 100% no-repeat;
               transition: opacity 0.35s ease-out; }
      #title[hidden] { display: none; }
      #title.leaving { opacity: 0; pointer-events: none; }
      #title .stage { position: relative; height: 100%; aspect-ratio: 1376 / 768; max-width: 100vw; container-type: size; }
      #title .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 47.2% 50%; display: block; }
      #title .panel { position: absolute; left: 3cqw; bottom: 3.6cqh; font-size: clamp(12px, 1.55cqw, 30px);
                      padding: 1.6em 2.6em 1.2em 1.2em; margin: -1.6em -2.6em -1.2em -1.2em;
                      background: radial-gradient(ellipse at 42% 58%, rgba(224, 212, 190, 0.94) 0%, rgba(224, 212, 190, 0.86) 46%, rgba(224, 212, 190, 0) 74%); }
      #title .row { display: flex; flex-wrap: wrap; gap: 0.7em; align-items: center; }
      #title .credits { margin: 0.9em 0 0; font-size: 0.86em; line-height: 1.45; letter-spacing: 0.03em; }
      #title .credits span { display: block; }
      @media (min-aspect-ratio: 1377/768) {
        /* beside the painting stands its own extension: soften the join */
        #title .art { -webkit-mask-image: linear-gradient(to right, transparent 0, #000 6%, #000 94%, transparent 100%);
                      mask-image: linear-gradient(to right, transparent 0, #000 6%, #000 94%, transparent 100%); }
      }
      @media (max-aspect-ratio: 1146/1000) {
        #title { place-items: start center; background: var(--paper) url(./assets/ui/title-tall.webp) top center / 100% auto no-repeat; }
        /* a column the height of the screen: the painting's box first, as tall as the keep zone needs at this
           width (100cqw / 1.1467) and shrinking when the panel under it needs the room; the panel keeps its size */
        #title .stage { height: 100%; width: 100%; aspect-ratio: auto; display: flex; flex-direction: column; }
        #title .stage picture { position: relative; flex: 0 1 calc(100cqw / 1.1467); min-height: 0; }
        /* the image is as tall as its box and as wide as the painting is at that height, up to the screen's
           width: so the box is never wider than the painting (which would crop its top and bottom) */
        #title .art { width: auto; max-width: 100%; margin: 0 auto;
                      -webkit-mask-image: linear-gradient(to bottom, #000 94%, transparent 100%);
                      mask-image: linear-gradient(to bottom, #000 94%, transparent 100%); }
        #title .panel { position: static; flex: none; margin: 0; padding: 5cqw 6cqw 3cqw; text-align: center;
                        font-size: clamp(15px, 4.4cqw, 24px); background: none; }
        #title .row { flex-direction: column; align-items: stretch; gap: 0.6em; }
        #title .credits { margin-top: 1.1em; text-shadow: 0 0 0.5em var(--paper), 0 0 0.25em var(--paper); }
      }
      @media (max-aspect-ratio: 1146/1000) and (min-aspect-ratio: 2/3) {
        /* Squarer than 2:3 the painting's box is shorter than the keep zone at full width, so the extension behind
           the buttons (laid from the top of the screen) would be the wrong part of it. Here the panel fills what
           is left and carries the extension from where the painting ends: title-tall.webp is the keep zone and
           then its mirror image, so the mirror starts 100cqw / 1.1467 down it. Narrower than 2:3 (a phone) the
           panel always fits under the whole keep zone, and nothing is changed. */
        #title .panel { flex: 1 0 auto;
                        background: var(--paper) url(./assets/ui/title-tall.webp) center calc(-100cqw / 1.1467) / 100cqw auto no-repeat; }
      }

      /* How to play: the courtyard painting as its header, a column of text under or beside it. */
      #help { position: fixed; inset: 0; z-index: 40; overflow: auto; background: var(--paper); color: var(--ink);
              font: 400 clamp(15px, 1.05vw + 9px, 21px)/1.5 var(--serif); -webkit-overflow-scrolling: touch; }
      #help[hidden] { display: none; }
      #help .sheet { max-width: 1040px; margin: 0 auto; min-height: 100%; }
      #help .head { display: block; position: relative; height: clamp(170px, 34vh, 400px); overflow: hidden; }
      #help .head img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 62%; display: block;
                        -webkit-mask-image: linear-gradient(to bottom, #000 70%, transparent 100%);
                        mask-image: linear-gradient(to bottom, #000 70%, transparent 100%); }
      #help .body { padding: 0 clamp(16px, 4vw, 44px) 0; }
      #help h1 { font-size: 1.9em; font-weight: 600; letter-spacing: 0.06em; margin: 0.2em 0 0.5em; }
      #help h2 { font-size: 1.05em; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; margin: 1.6em 0 0.5em;
                 padding-bottom: 0.25em; border-bottom: 0.08em solid var(--ink); }
      #help h3 { font-size: 0.86em; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); margin: 1.1em 0 0.3em; }
      #help p { margin: 0.4em 0; max-width: 62ch; }
      #help dl { display: grid; grid-template-columns: minmax(7.5em, max-content) 1fr; gap: 0.35em 1.2em; margin: 0.3em 0; }
      #help dt { font-weight: 600; }
      #help dd { margin: 0; }
      #help table { border-collapse: collapse; width: 100%; max-width: 44em; }
      #help th, #help td { text-align: left; padding: 0.3em 1.2em 0.3em 0; vertical-align: top; border-bottom: 0.06em solid rgba(32, 32, 30, 0.22); }
      #help th { font-size: 0.8em; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; }
      #help kbd, #teach kbd { display: inline-block; font: 600 0.82em/1.2 ui-monospace, "SF Mono", Menlo, Consolas, monospace; padding: 0.15em 0.45em;
                  margin: 0.08em 0.1em; border: 0.1em solid var(--ink); border-radius: 0.3em; background: rgba(255, 255, 255, 0.28); white-space: nowrap; }
      #help .sound { display: flex; flex-wrap: wrap; gap: 0.8em 1.2em; align-items: center; }
      #help input[type="range"] { width: min(16em, 60vw); accent-color: var(--ink); }
      #help .foot { margin-top: 2em; display: flex; gap: 1em; align-items: center; flex-wrap: wrap; position: sticky; bottom: 0;
                    padding: 0.9em 0 1em; background: linear-gradient(to bottom, rgba(224, 212, 190, 0), var(--paper) 38%); }
      @media (min-aspect-ratio: 3/2) and (min-height: 520px) {
        /* a wide screen: the painting whole on the left, the text in a column on the right */
        #help .sheet { max-width: none; width: fit-content; display: grid; grid-template-columns: min(100vh, 44vw) minmax(0, 46em); gap: 0 clamp(20px, 3vw, 64px); }
        #help .head { height: 100vh; position: sticky; top: 0; }
        #help .head img { object-position: 50% 50%;
                          -webkit-mask-image: linear-gradient(to right, #000 86%, transparent 100%);
                          mask-image: linear-gradient(to right, #000 86%, transparent 100%); }
        #help .body { padding-top: clamp(20px, 5vh, 70px); }
      }

      /* D-025: the chapter list. A card of paper over whatever it was opened from (the title, or the how-to-play
         page), which shows through a wash of paper. Every chapter is a button; none is ever locked. */
      #chapters { position: fixed; inset: 0; z-index: 45; display: grid; place-items: center; overflow: auto; box-sizing: border-box;
                  padding: 16px; background: rgba(224, 212, 190, 0.8); color: var(--ink);
                  font: 400 clamp(15px, 1.05vw + 9px, 21px)/1.5 var(--serif); -webkit-overflow-scrolling: touch; }
      #chapters[hidden] { display: none; }
      #chapters .card { box-sizing: border-box; width: min(100%, 25em); padding: 1.1em 1.3em 1.2em; background: var(--paper);
                        border: 0.12em solid var(--ink); border-radius: 0.3em; }
      #chapters h1 { font-size: 1.05em; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; margin: 0 0 0.9em;
                     padding-bottom: 0.25em; border-bottom: 0.08em solid var(--ink); }
      #chapters .list { display: flex; flex-direction: column; gap: 0.55em; }
      #chapters .list .btn { display: flex; gap: 1em; align-items: baseline; width: 100%; text-align: left; text-transform: none; letter-spacing: 0.03em; }
      /* the chapter in focus is the one a key or a pad's A will start: it is always marked, however it got the focus */
      #chapters .btn:focus { outline: 0.18em solid var(--ink); outline-offset: 0.2em; }
      #chapters .list .n { flex: none; font-size: 0.8em; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); }
      #chapters .foot { margin-top: 1.1em; }

      /* ---- D-027: the touch controls. None of these elements is in the document unless the game's module put it
         there (src/ui/touch-ui.ts): on a device whose main pointer is a finger, or on a first touch. <html class="touch">
         is set at the same moment, so nothing below reaches a page with a mouse. Sizes and places are set from
         TOUCH (src/engine/touch.ts); here is only the look: ink on paper, part see-through, no accent (STYLE 2).
         Every number is in MEASUREMENTS.md "D-027 touch controls". ---- */
      html.touch, html.touch body { overscroll-behavior: none; touch-action: manipulation; -webkit-touch-callout: none;
                                    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      html.touch #app, html.touch #app canvas { touch-action: none; }
      html.touch #help, html.touch #chapters { touch-action: pan-y; }
      /* the hint's line names keys, and stands where the stick is: on touch the pause button is the way to all of it */
      html.touch #hint { display: none; }
      /* the teach line moves to the top, clear of the thumbs, between the screen's corners */
      html.touch #teach { top: calc(10px + env(safe-area-inset-top, 0px)); bottom: auto; max-width: min(calc(100vw - 148px), 44em); }
      #touch { position: fixed; inset: 0; z-index: 6; pointer-events: none; font-family: var(--serif); color: var(--ink); }
      #touch[hidden], #touch-pause[hidden], #touch-card[hidden], #touch-turn[hidden] { display: none; }
      #touch .stick { position: absolute; box-sizing: border-box; border-radius: 50%; border: 2px solid rgba(32, 32, 30, 0.55);
                      background: rgba(224, 212, 190, 0.3); }
      #touch .stick.sprint { border-color: var(--ink); }
      #touch .knob { position: absolute; left: 50%; top: 50%; box-sizing: border-box; border-radius: 50%; will-change: transform;
                     border: 2px solid rgba(224, 212, 190, 0.75); background: rgba(32, 32, 30, 0.5); }
      #touch .stick.on .knob { background: rgba(32, 32, 30, 0.8); }
      #touch .tb { position: absolute; box-sizing: border-box; border-radius: 50%; display: grid; place-items: center;
                   border: 2px solid rgba(32, 32, 30, 0.6); background: rgba(224, 212, 190, 0.42);
                   font: 600 13px/1 var(--serif); letter-spacing: 0.07em; text-transform: uppercase;
                   text-shadow: 0 0 0.4em var(--paper), 0 0 0.2em var(--paper); }
      #touch .tb.jump { font-size: 16px; }
      #touch .tb.on { background: rgba(32, 32, 30, 0.8); color: var(--paper); text-shadow: none; }
      #touch-pause { position: fixed; z-index: 7; box-sizing: border-box; padding: 0; cursor: pointer; border-radius: 0.2em;
                     border: 2px solid rgba(32, 32, 30, 0.6); background: rgba(224, 212, 190, 0.5);
                     -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
      /* two upright bars, drawn */
      #touch-pause::before { content: ""; position: absolute; left: 50%; top: 50%; width: 5px; height: 16px; margin: -8px 0 0 -7px;
                             border-left: 5px solid var(--ink); border-right: 5px solid var(--ink); box-sizing: content-box; }
      #touch-pause:focus-visible { outline: 0.18em solid var(--ink); outline-offset: 0.2em; }
      #touch-card { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; box-sizing: border-box; overflow: auto;
                    padding: calc(12px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) calc(16px + env(safe-area-inset-left, 0px));
                    background: rgba(224, 212, 190, 0.6); color: var(--ink); font: 400 clamp(15px, 1.05vw + 9px, 21px)/1.5 var(--serif); }
      #touch-card .card { box-sizing: border-box; max-width: 100%; padding: 1em 1.3em 1.2em; text-align: center; background: var(--paper);
                          border: 0.12em solid var(--ink); border-radius: 0.3em; }
      #touch-card h1 { font-size: 1.05em; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; margin: 0 0 0.9em;
                       padding-bottom: 0.25em; border-bottom: 0.08em solid var(--ink); }
      #touch-card .row { display: flex; flex-wrap: wrap; gap: 0.6em; justify-content: center; }
      #touch-turn { position: fixed; inset: 0; z-index: 25; display: grid; place-items: center; box-sizing: border-box; padding: 24px;
                    text-align: center; background: var(--paper); color: var(--ink);
                    font: 500 clamp(18px, 5vw, 28px)/1.4 var(--serif); letter-spacing: 0.03em; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <template id="shell">
      <div id="title" role="main" aria-label="Karasu: Flight of the Exile">
        <div class="stage">
          <picture>
            <source srcset="./assets/ui/title.webp" type="image/webp" />
            <img class="art" src="./assets/ui/title.jpg" width="1376" height="768" fetchpriority="high" decoding="async"
                 alt="Karasu: Flight of the Exile. An ink painting of a warrior in a straw hat steering a small boat through a storm, crows overhead." />
          </picture>
          <div class="panel">
            <div class="row">
              <button id="title-play" class="btn primary" type="button">Play</button>
              <button id="title-help" class="btn" type="button">How to play</button>
              <button id="title-chapters" class="btn" type="button">Chapters</button>
              <button id="title-sound" class="btn quiet" type="button" aria-pressed="true">Sound: on</button>
            </div>
            <p class="credits"><span>Designed by Tim de Vallée</span><span>Dedicated to Remi</span></p>
          </div>
        </div>
      </div>
      <div id="help" hidden role="dialog" aria-modal="true" aria-labelledby="help-h">
        <div class="sheet">
          <picture class="head">
            <source srcset="./assets/ui/courtyard.webp" type="image/webp" />
            <img src="./assets/ui/courtyard.jpg" width="1024" height="1024" loading="lazy" decoding="async"
                 alt="An ink painting of the warrior facing three swordsmen in a walled courtyard." />
          </picture>
          <div class="body">
            <h1 id="help-h">How to play</h1>
            <div id="help-content"></div>
            <h2>Sound</h2>
            <div class="sound">
              <button id="help-sound" class="btn" type="button" aria-pressed="true">Sound: on</button>
              <label>Volume <input id="help-volume" type="range" min="0" max="100" step="5" value="80" /></label>
            </div>
            <div class="foot">
              <button id="help-back" class="btn primary" type="button">Back</button>
              <button id="help-chapters" class="btn" type="button">Chapters</button>
            </div>
          </div>
        </div>
      </div>
      <div id="chapters" hidden role="dialog" aria-modal="true" aria-labelledby="chapters-h">
        <div class="card">
          <h1 id="chapters-h">Chapters</h1>
          <div id="chapters-list" class="list"></div>
          <div class="foot"><button id="chapters-back" class="btn" type="button">Back</button></div>
        </div>
      </div>
    </template>
    <script>
      // The shell is stamped into the page here, before the game's module loads, so the title painting is the
      // first thing drawn and the game loads behind it. A bare page drops the template: nothing of it remains.
      // A press that arrives before the game is ready is kept in <html data-intent> and honoured when it is.
      (function () {
        var root = document.documentElement, tpl = document.getElementById('shell');
        if (root.className !== 'shell') { tpl.remove(); return; }
        document.body.appendChild(tpl.content);
        tpl.remove();
        var play = document.getElementById('title-play');
        function want(what) {
          if (root.dataset.shell === 'ready') return; // the game has its own listeners from here on
          root.dataset.intent = what;
          if (what === 'play') { play.textContent = 'Loading…'; play.disabled = true; }
        }
        play.addEventListener('click', function () { want('play'); });
        document.getElementById('title-help').addEventListener('click', function () { want('help'); });
        document.getElementById('title-chapters').addEventListener('click', function () { want('chapters'); });
        window.addEventListener('keydown', function (e) { if (e.code === 'Enter' || e.code === 'Space') want('play'); });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
